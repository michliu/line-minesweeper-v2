<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>踩地雷 - Minesweeper</title>
  <script src="https://static.line-scdn.net/liff/2.14/sdk.js"></script>
  <style>
    :root {
      --bg-1: #0f172a; --bg-2: #1e293b; --panel: rgba(15, 23, 42, 0.76);
      --panel-border: rgba(255, 255, 255, 0.12); --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #22c55e; --danger: #f43f5e; --warning: #f59e0b;
      --shadow: 0 20px 50px rgba(2, 8, 23, 0.45); --cell-size: 38px; --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 30%),
                  linear-gradient(145deg, var(--bg-1), var(--bg-2));
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .app { width: 100%; max-width: 980px; background: var(--panel); border: 1px solid var(--panel-border);
           border-radius: 28px; box-shadow: var(--shadow); backdrop-filter: blur(18px); overflow: hidden; }
    .header { display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 14px; }
    .title-wrap h1 { margin: 0; font-size: 1.6rem; }
    .title-wrap p { margin: 6px 0 0; color: var(--muted); font-size: 0.85rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .difficulty, .button {
      border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.06);
      color: var(--text); border-radius: 12px; height: 42px; padding: 0 14px; font-size: 0.9rem;
    }
    .difficulty { cursor: pointer; flex: 1; }
    .button { cursor: pointer; font-weight: 700; }
    .mode-toggle { display: flex; gap: 8px; width: 100%; margin-top: 8px; }
    .mode-btn {
      flex: 1; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.06);
      color: var(--muted); border-radius: 12px; height: 48px; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .mode-btn.active { background: rgba(56, 189, 248, 0.25); color: var(--accent); border-color: var(--accent); }
    .mode-btn .icon { font-size: 1.2rem; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 20px 18px; }
    .stat { height: auto; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.06); border-radius: 12px; }
    .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-value { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .board-wrap { padding: 0 20px 20px; }
    .board-shell { overflow: auto; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.08);
                   background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02)); padding: 14px; }
    .board { display: grid; gap: 5px; width: max-content; margin: 0 auto; user-select: none; }
    .cell {
      width: var(--cell-size); height: var(--cell-size); border: none; border-radius: 10px; cursor: pointer;
      font-size: 1rem; font-weight: 800; color: var(--text);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.08));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 14px rgba(2, 8, 23, 0.18);
      transition: transform 0.1s ease, background 0.12s ease; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .cell:active:not(.revealed):not(.flagged) { transform: scale(0.95); }
    .cell.revealed { cursor: default; background: rgba(15, 23, 42, 0.62); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
    .cell.mine { background: linear-gradient(180deg, rgba(244, 63, 94, 0.45), rgba(127, 29, 29, 0.8)); }
    .cell.flagged { background: linear-gradient(180deg, rgba(245, 158, 11, 0.38), rgba(120, 53, 15, 0.75)); }
    .cell:disabled { opacity: 1; }
    .n1 { color: #60a5fa; } .n2 { color: #34d399; } .n3 { color: #f87171; }
    .n4 { color: #a78bfa; } .n5 { color: #fb7185; } .n6 { color: #22d3ee; }
    .n7 { color: #facc15; } .n8 { color: #cbd5e1; }
    .footer { padding: 0 20px 20px; color: var(--muted); font-size: 0.85rem; text-align: center; }
    .liff-info { padding: 10px 20px; background: rgba(34, 197, 94, 0.15); border-top: 1px solid rgba(34, 197, 94, 0.3);
                 color: #4ade80; font-size: 0.8rem; display: none; }
    .liff-info.show { display: block; }
    @media (max-width: 600px) {
      :root { --cell-size: 30px; }
      body { padding: 10px; }
      .header, .stats, .board-wrap, .footer { padding-left: 14px; padding-right: 14px; }
      .mode-btn { height: 44px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="title-wrap">
        <h1>💣 踩地雷</h1>
        <p>經典遊戲，優化觸控體驗</p>
      </div>
      <div class="controls">
        <select id="difficulty" class="difficulty" aria-label="選擇難度">
          <option value="easy">簡單 9×9</option>
          <option value="medium">中等 16×16</option>
          <option value="hard">困難 16×30</option>
        </select>
        <button id="new-game" class="button" type="button">新遊戲</button>
      </div>
      <div class="mode-toggle">
        <button id="mode-reveal" class="mode-btn active"><span class="icon">👆</span> 點擊揭露</button>
        <button id="mode-flag" class="mode-btn"><span class="icon">🚩</span> 點擊插旗</button>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <span class="stat-label">🚩 剩餘</span>
        <span id="mines-left" class="stat-value">10</span>
      </div>
      <div class="stat">
        <span class="stat-label">⏱️ 時間</span>
        <span id="timer" class="stat-value">000</span>
      </div>
    </section>

    <section class="board-wrap">
      <div class="board-shell">
        <div id="board" class="board" aria-label="踩地雷棋盤"></div>
      </div>
    </section>

    <div class="footer">切換上方的模式來揭露或插旗</div>
    <div id="liff-info" class="liff-info">✅ 在 LINE 中執行</div>
  </main>

  <script>
    async function initLIFF() {
      try {
        await liff.init({ liffId: '2009416166-3S9jtxfm' });
        if (liff.isInClient()) document.getElementById('liff-info').classList.add('show');
      } catch (e) { console.log('LIFF not in LINE'); }
    }

    const configs = {
      easy: { rows: 9, cols: 9, mines: 10 },
      medium: { rows: 16, cols: 16, mines: 40 },
      hard: { rows: 16, cols: 30, mines: 99 },
    };

    const boardElement = document.getElementById('board');
    const timerElement = document.getElementById('timer');
    const minesLeftElement = document.getElementById('mines-left');
    const difficultyElement = document.getElementById('difficulty');
    const newGameButton = document.getElementById('new-game');
    const modeRevealBtn = document.getElementById('mode-reveal');
    const modeFlagBtn = document.getElementById('mode-flag');

    let grid = [], currentConfig = configs.easy, firstMove = true;
    let flaggedCount = 0, revealedCount = 0, gameOver = false;
    let timer = 0, timerId = null;
    let currentMode = 'reveal'; // 'reveal' or 'flag'

    function setMode(mode) {
      currentMode = mode;
      modeRevealBtn.classList.toggle('active', mode === 'reveal');
      modeFlagBtn.classList.toggle('active', mode === 'flag');
    }

    modeRevealBtn.addEventListener('click', () => setMode('reveal'));
    modeFlagBtn.addEventListener('click', () => setMode('flag'));

    function createCell(row, col) {
      return { row, col, isMine: false, adjacent: 0, revealed: false, flagged: false, element: null };
    }

    function initGame() {
      currentConfig = configs[difficultyElement.value];
      firstMove = true; flaggedCount = 0; revealedCount = 0; gameOver = false;
      timer = 0;
      clearInterval(timerId); timerId = null;
      timerElement.textContent = '000';
      minesLeftElement.textContent = currentConfig.mines;
      boardElement.innerHTML = '';
      boardElement.style.gridTemplateColumns = `repeat(${currentConfig.cols}, var(--cell-size))`;
      grid = Array.from({ length: currentConfig.rows }, (_, row) =>
        Array.from({ length: currentConfig.cols }, (_, col) => createCell(row, col))
      );

      for (let row = 0; row < currentConfig.rows; row++) {
        for (let col = 0; col < currentConfig.cols; col++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell';
          btn.setAttribute('aria-label', `格子 ${row + 1}, ${col + 1}`);
          
          btn.addEventListener('click', () => {
            if (currentMode === 'reveal') handleReveal(row, col);
            else handleFlag(row, col);
          });
          
          // 桌面版右鍵
          btn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleFlag(row, col);
          });
          
          grid[row][col].element = btn;
          boardElement.appendChild(btn);
        }
      }
    }

    function startTimer() {
      if (timerId || gameOver) return;
      timerId = setInterval(() => {
        timer++; timerElement.textContent = String(Math.min(timer, 999)).padStart(3, '0');
      }, 1000);
    }

    function inBounds(row, col) {
      return row >= 0 && row < currentConfig.rows && col >= 0 && col < currentConfig.cols;
    }

    function getNeighbors(row, col) {
      const neighbors = [];
      for (let r = -1; r <= 1; r++) {
        for (let c = -1; c <= 1; c++) {
          if (r === 0 && c === 0) continue;
          if (inBounds(row + r, col + c)) neighbors.push(grid[row + r][col + c]);
        }
      }
      return neighbors;
    }

    function placeMines(safeRow, safeCol) {
      const candidates = [];
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          if (r === safeRow && c === safeCol) continue;
          candidates.push(grid[r][c]);
        }
      }
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }
      for (let i = 0; i < currentConfig.mines; i++) candidates[i].isMine = true;
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          if (!grid[r][c].isMine) {
            grid[r][c].adjacent = getNeighbors(r, c).filter(n => n.isMine).length;
          }
        }
      }
    }

    function handleReveal(row, col) {
      if (gameOver) return;
      const cell = grid[row][col];
      if (cell.revealed || cell.flagged) return;

      if (firstMove) { placeMines(row, col); firstMove = false; startTimer(); }
      revealCell(cell);
      checkWin();
    }

    function revealCell(cell) {
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true; revealedCount++;
      const btn = cell.element;
      btn.classList.add('revealed'); btn.disabled = true;

      if (cell.isMine) {
        btn.classList.add('mine'); btn.textContent = '💣';
        endGame(false); return;
      }
      if (cell.adjacent > 0) {
        btn.textContent = String(cell.adjacent); btn.classList.add('n' + cell.adjacent);
        return;
      }
      getNeighbors(cell.row, cell.col).forEach(n => { if (!n.revealed && !n.isMine) revealCell(n); });
    }

    function handleFlag(row, col) {
      if (gameOver) return;
      const cell = grid[row][col];
      if (cell.revealed) return;
      if (firstMove) startTimer();

      cell.flagged = !cell.flagged;
      flaggedCount += cell.flagged ? 1 : -1;
      cell.element.classList.toggle('flagged', cell.flagged);
      cell.element.textContent = cell.flagged ? '🚩' : '';
      minesLeftElement.textContent = currentConfig.mines - flaggedCount;
    }

    function revealAllMines() {
      grid.flat().forEach(cell => {
        if (cell.isMine) {
          cell.element.classList.add('revealed', 'mine');
          cell.element.textContent = '💣';
        }
        cell.element.disabled = true;
      });
    }

    function checkWin() {
      const safeCells = currentConfig.rows * currentConfig.cols - currentConfig.mines;
      if (!gameOver && revealedCount === safeCells) endGame(true);
    }

    function endGame(didWin) {
      gameOver = true;
      clearInterval(timerId); timerId = null;
      if (!didWin) { revealAllMines(); return showAlert('💥 爆炸了！遊戲結束。'); }
      grid.flat().forEach(cell => {
        cell.element.disabled = true;
        if (cell.isMine && !cell.flagged) {
          cell.flagged = true; cell.element.textContent = '🚩'; cell.element.classList.add('flagged');
        }
      });
      minesLeftElement.textContent = '0';
      showAlert('🎉 恭喜！你贏了！');
    }

    function showAlert(msg) {
      if (typeof liff !== 'undefined' && liff.isInClient()) {
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;font-size:1.2rem;color:white;padding:20px;text-align:center;';
        o.textContent = msg;
        o.addEventListener('click', () => o.remove());
        document.body.appendChild(o);
      } else { alert(msg); }
    }

    difficultyElement.addEventListener('change', initGame);
    newGameButton.addEventListener('click', initGame);

    initLIFF().then(initGame);
  </script>
</body>
</html>
